name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_superuser_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AJGEM_TEST_PG: ${{ matrix.db == 'postgres' && '1' || '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Tesseract OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - name: Create owner and RLS-constrained runtime roles
        if: matrix.db == 'postgres'
        env:
          PGPASSWORD: ci_superuser_pw
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ajgem_owner LOGIN PASSWORD 'owner_dev_pw' BYPASSRLS;
          CREATE ROLE ajgem_app LOGIN PASSWORD 'app_dev_pw' NOBYPASSRLS;
          CREATE DATABASE ajgem_test OWNER ajgem_owner;
          SQL
      - run: python -m pytest -rs

  frontend:
    name: Frontend typecheck, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 3

  e2e:
    name: Browser milestone walkthrough
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
      - name: Install backend and Tesseract OCR
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng
          pip install -r backend/requirements-dev.txt
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Seed synthetic data and start server
        working-directory: backend
        run: |
          python scripts/seed_demo.py
          nohup python -m ajgem serve > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/dev/users > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Run milestone walkthrough
        working-directory: frontend
        run: node e2e/milestone.cjs
      - name: Restart in OIDC mode with the development mock identity provider
        working-directory: backend
        run: |
          pkill -f "ajgem serve" || true
          rm -rf var && python scripts/seed_demo.py
          nohup python scripts/mock_oidc.py > idp.log 2>&1 &
          AJGEM_AUTH_MODE=oidc AJGEM_OIDC_ISSUER=http://127.0.0.1:9000 AJGEM_OIDC_CLIENT_ID=ajgem-web \
            nohup python -m ajgem serve > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/auth/config > /dev/null && exit 0; sleep 1; done
          cat server.log idp.log; exit 1
      - name: Run OIDC sign-in walkthrough
        working-directory: frontend
        run: node e2e/oidc.cjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            frontend/e2e/out
            backend/server.log
            backend/idp.log
          retention-days: 7

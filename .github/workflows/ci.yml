name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Tesseract OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -rs

  frontend:
    name: Frontend typecheck, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 3

  e2e:
    name: Browser milestone walkthrough
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
      - name: Install backend and Tesseract OCR
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng
          pip install -r backend/requirements-dev.txt
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Seed synthetic data and start server
        working-directory: backend
        run: |
          python scripts/seed_demo.py
          nohup python -m ajgem serve > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/dev/users > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Run milestone walkthrough
        working-directory: frontend
        run: node e2e/milestone.cjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            frontend/e2e/out
            backend/server.log
          retention-days: 7
